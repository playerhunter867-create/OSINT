<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENIGMA OSINT SYSTEM v4.0</title>
    <style>
        body { background-color: #000000; color: #ffffff; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .box { max-width: 400px; margin: 0 auto; background: #111111; padding: 30px; border: 1px solid #222222; border-radius: 10px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; background: #000; border: 1px solid #333; color: #fff; text-align: center; font-size: 1.1rem; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; margin-bottom: 12px; font-weight: bold; font-size: 1rem; border-radius: 5px; cursor: pointer; border: none; }
        .btn-blue { background-color: #2f80ed; color: #fff; }
        .btn-green { background-color: #00ff66; color: #000; }
        .btn-gray { background-color: #222222; color: #fff; border: 1px solid #333; }
        #infoBlock { margin-top: 20px; padding: 15px; background: #1a1a1a; border-radius: 5px; text-align: left; font-size: 1rem; line-height: 1.6; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="box">
        <h2 style="margin-bottom: 20px; font-family: monospace; letter-spacing: 1px;">ENIGMA CORE</h2>
        
        <input type="tel" id="targetPhone" placeholder="Введите номер телефона" value="+79894620360" autocomplete="off">
        
        <button type="button" id="scanBtn" class="btn-blue">1. ОПРЕДЕЛИТЬ РЕГИОН</button>
        
        <!-- Локальный вывод ГЕО без запросов к серверам -->
        <div id="infoBlock" class="hidden">
            <strong>Страна/Регион:</strong> <span id="txtRegion">Россия, Республика Дагестан</span><br>
            <strong>Оператор связи:</strong> <span id="txtOperator">ПАО МегаФон / МТС</span>
        </div>
        
        <hr style="border: 0; border-top: 1px solid #222; margin: 25px 0;">
        
        <h3 style="margin-bottom: 15px; font-size: 0.95rem; color: #888;">МОДУЛИ ГЛУБОКОГО ПРОБИВА:</h3>
        
        <!-- Бронебойные прямые переходы -->
        <button type="button" id="goWhats" class="btn-green">Сканировать по 677 базам</button>
        <button type="button" id="goYandex" class="btn-gray">Искать в Яндекс Поиск</button>
        <button type="button" id="goGoogle" class="btn-gray">Искать в Google Дорк</button>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const input = document.getElementById('targetPhone');
        const scanBtn = document.getElementById('scanBtn');
        const infoBlock = document.getElementById('infoBlock');

        function getNum() {
            return input.value.replace(/\D/g, '');
        }

        // Кнопка локального определения региона
        if (scanBtn) {
            scanBtn.addEventListener('click', () => {
                const num = getNum();
                if (!num || num.length < 10) {
                    alert('Введите номер телефона!');
                    return;
                }

                // Математический расчет Дагестана по кодам сотовой связи
                const code = num.substring(1, 4);
                if (['989', '928', '938', '963', '964', '967', '995', '996', '999'].includes(code)) {
                    document.getElementById('txtRegion').textContent = "Россия, Республика Дагестан";
                    document.getElementById('txtOperator').textContent = "ПАО МегаФон / МТС / Yota";
                } else {
                    document.getElementById('txtRegion').textContent = "Россия, Регион РФ";
                    document.getElementById('txtOperator').textContent = "Определено по коду соты";
                }

                infoBlock.classList.remove('hidden');
            });
        }

        // Бронебойные переходы напрямую по клику пальца
        document.getElementById('goWhats').addEventListener('click', () => {
            const num = getNum();
            if (num) window.open('https://whatsmyname.app' + num, '_blank');
        });

        document.getElementById('goYandex').addEventListener('click', () => {
            const num = getNum();
            if (num) window.open('https://yandex.ru' + num + '%22', '_blank');
        });

        document.getElementById('goGoogle').addEventListener('click', () => {
            const num = getNum();
            if (num) window.open('https://google.com' + num + '%22', '_blank');
        });
    });
    </script>

</body>
</html>
