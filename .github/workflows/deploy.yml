name: Extract, Commit & Deploy OSINT-HUB

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find Dashboard ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f -name "*.zip" -print
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::ZIP file not found in repository root."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "::error::Multiple ZIP files found."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          ZIP="${ZIPS[0]}"

          echo "Using ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract Dashboard
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.zip.outputs.zip }}"

          rm -rf _extract _site
          mkdir -p _extract _site

          echo "Extracting $ZIP..."

          unzip -q "$ZIP" -d _extract

          mapfile -t TOP < <(
            find _extract -mindepth 1 -maxdepth 1 -print
          )

          # Supports:
          # ZIP/index.html
          # ZIP/OSINT-HUB/index.html

          if [ "${#TOP[@]}" -eq 1 ] && [ -d "${TOP[0]}" ]; then
            ROOT="${TOP[0]}"
          else
            ROOT="_extract"
          fi

          if [ ! -f "$ROOT/index.html" ]; then
            echo "::error::index.html not found."
            echo "Extracted files:"
            find _extract -maxdepth 3 -type f | sort
            exit 1
          fi

          cp -a "$ROOT"/. _site/

          echo "Dashboard extracted successfully."

      - name: Replace repository files
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(basename "${{ steps.zip.outputs.zip }}")"

          # Delete old project files.
          # Keep .git, .github and the original ZIP.
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "$ZIP" \
            -exec rm -rf {} +

          # Put extracted Dashboard into repository root.
          cp -a _site/. .

          echo "Repository after extraction:"
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" | sort

      - name: Commit extracted Dashboard
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: extract OSINT-HUB Dashboard"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
