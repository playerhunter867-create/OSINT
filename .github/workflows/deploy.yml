name: OSINT-HUB - Extract and Deploy

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: osint-hub-pages
  cancel-in-progress: true

jobs:

  prepare:
    name: Extract Dashboard
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        id: find_zip
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Dashboard ZIP not found."
            exit 1
          fi

          echo "Found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -q "${{ steps.find_zip.outputs.zip }}" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | sort

      - name: Locate Dashboard
        id: locate
        run: |
          set -e

          if [ -f "extracted/index.html" ]; then
            echo "root=extracted" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          INDEX=$(find extracted -type f -name "index.html" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html not found."
            exit 1
          fi

          ROOT=$(dirname "$INDEX")

          echo "Dashboard root: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Replace repository files
        run: |
          set -e

          ROOT="${{ steps.locate.outputs.root }}"
          ZIP="$(basename "${{ steps.find_zip.outputs.zip }}")"

          echo "Dashboard root: $ROOT"

          # Remove old extracted project files.
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "$ZIP" \
            ! -name "extracted" \
            -exec rm -rf {} +

          # Copy new Dashboard.
          cp -a "$ROOT"/. .

          echo "Repository contents:"
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" | sort

      - name: Commit Dashboard
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: extract OSINT-HUB Dashboard"
            git push origin main
          fi

      - name: Create Pages directory
        run: |
          set -e

          rm -rf pages

          mkdir pages

          # Copy only the actual website files.
          cp -a index.html pages/

          [ -f styles.css ] && cp -a styles.css pages/
          [ -f app.js ] && cp -a app.js pages/
          [ -f sherlock.html ] && cp -a sherlock.html pages/

          [ -d assets ] && cp -a assets pages/
          [ -d public ] && cp -a public pages/
          [ -d osint-framework ] && cp -a osint-framework pages/

          echo "Pages contents:"
          find pages -maxdepth 4 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

  deploy:
    name: Deploy Dashboard
    needs: prepare
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
